<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII-арт · локальный конвертер </title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0c0c; color: #33ff33;
      font-family: 'Courier New', monospace;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 2rem 1rem;
    }
    .terminal {
      max-width: 1000px; width: 100%;
      border: 2px solid #33ff33; border-radius: 8px; padding: 1.5rem;
      background: #0a0a0a;
      box-shadow: 0 0 15px rgba(51,255,51,0.2);
    }
    h1 { font-size: 1.8rem; margin-bottom: 1rem; text-shadow: 0 0 5px #33ff33; letter-spacing: 2px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;
      margin: 1rem 0; padding: 1rem; background: #111;
      border: 1px dashed #33ff33; border-radius: 5px;
    }
    label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    input[type="file"] { color:#33ff33; background:transparent; border:1px solid #33ff33; padding:0.3rem; border-radius:4px; font-family:inherit; }
    input[type="range"] { accent-color: #33ff33; }
    select { background: #000; color: #33ff33; border: 1px solid #33ff33; padding: 0.3rem; font-family: inherit; }
    button {
      background: #33ff33; color: #000; border: none; padding: 0.4rem 1rem;
      font-weight: bold; font-family: inherit; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #00cc00; box-shadow: 0 0 10px #33ff33; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color:#ff5555; background:#1a0000; border:1px solid #ff5555; padding:0.5rem; margin-bottom:1rem; display:none; }
    pre {
      background: #000; color: #33ff33; padding: 1rem;
      border: 1px solid #33ff33; border-radius: 5px; overflow-x: auto;
      font-size: 0.5rem; line-height: 1; white-space: pre;
      max-height: 70vh; overflow-y: auto; margin-top: 1rem;
    }
    .footer-note { margin-top: 1rem; font-size: 0.8rem; opacity: 0.7; }
    #widthValue { font-weight: bold; }
    @media (max-width: 600px) { .controls { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="terminal">
    <h1>▸ ASCII_ART.LOCAL — выбор набора</h1>
    <div id="jsonError" class="error"></div>

    <div class="controls">
      <label>📁 <input type="file" id="imageInput" accept="image/*"></label>
      <label>🔤 Ширина <input type="range" id="widthSlider" min="30" max="200" value="100" step="5">
        <span id="widthValue">100</span>
      </label>
      <label>🎨 Набор:
        <select id="charsetSelect">
          <option value="classic" selected>Классический (10)</option>
          <option value="blocks">Блоки (25)</option>
          <option value="detailed">Детальный (70)</option>
          <option value="letters">Буквы (50)</option>
          <option value="minimal">Минимальный (5)</option>
          <option value="json">Из charset.json </option>
        </select>
      </label>
      <button id="copyBtn" disabled>📋 Копировать</button>
      <button id="downloadBtn" disabled>💾 Сохранить .txt</button>
    </div>

    <pre id="output">// выберите изображение</pre>
    <div class="footer-note">Встроенные наборы + опциональный charset.json</div>
  </div>

  <script>
    (function() {
      // --- предустановленные наборы (от тёмного к светлому) ---
      const presets = {
        classic:   ['@', '%', '#', '*', '+', '=', '-', ':', '.', ' '],
        blocks:    ['█','▓','▒','░','▇','▆','▅','▄','▃','▂','▁','■','□','▪','▫','●','○','◆','◇','▲','△','▼','▽','◀','◁','▶','▷',' '],
        detailed:  ['█','▓','▒','░','@','&','%','#','★','☆','♦','◉','●','◈','◇','◆','■','□','▇','▆','▅','▄','▃','▂','▁','▀','▼','▲','◀','▶',
                    'M','W','N','8','B','0','Q','D','O','G','E','H','K','A','U','V','Z','P','R','S','T','X','Y','J','L','C','F','I','9',
                    '7','6','5','4','3','2','1','?','!','=','+','*','^','~','#','%','$','€','¥','₽','«','»','"',"'",'`','|','/','\\','(',')',
                    '[',']','{','}','<','>',':',',','.','-','_','¨','°','·',' '],
        letters:   ['M','W','N','8','B','0','Q','D','O','G','E','H','K','A','U','V','Z','P','R','S','T','X','Y','J','L','C','F','I','9',
                    '7','6','5','4','3','2','1','?','!','=','+','*','^','~','#','%','$','€','¥','₽','«','»','"',"'",'`','|','/','\\','(',')',
                    '[',']','{','}','<','>',':',',','.','-','_','¨','°','·',' '],
        minimal:   ['#', '.', ':', '-', ' ']
      };

      const imageInput = document.getElementById('imageInput');
      const widthSlider = document.getElementById('widthSlider');
      const widthValue = document.getElementById('widthValue');
      const outputPre = document.getElementById('output');
      const downloadBtn = document.getElementById('downloadBtn');
      const copyBtn = document.getElementById('copyBtn');
      const jsonErrorDiv = document.getElementById('jsonError');
      const charsetSelect = document.getElementById('charsetSelect');

      let jsonCharset = [];            // загруженный из charset.json
      let activeCharset = presets.classic;
      let currentImage = null;
      let currentAscii = '';
      const SYMBOL_RATIO = 0.55;

      // --- загрузка charset.json ---
      async function loadJsonCharset() {
        try {
          const resp = await fetch('charset.json');
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          if (!Array.isArray(data) || data.length === 0) throw new Error('пустой массив');
          jsonCharset = data.filter(ch => ch !== '\u2800'); // убираем брайлевский пробел
          jsonErrorDiv.style.display = 'none';
          console.log('charset.json загружен, символов:', jsonCharset.length);
        } catch (err) {
          jsonErrorDiv.style.display = 'block';
          jsonErrorDiv.textContent = `⚠️ charset.json не загружен: ${err.message}. Пункт "Из charset.json" будет использовать классический набор.`;
          jsonCharset = [];
        }
      }

      // обновление активного набора по выбору
      function updateActiveCharset() {
        const val = charsetSelect.value;
        if (val === 'json') {
          activeCharset = jsonCharset.length > 0 ? jsonCharset : presets.classic;
        } else {
          activeCharset = presets[val] || presets.classic;
        }
        updateAscii();
      }

      charsetSelect.addEventListener('change', updateActiveCharset);

      function imageToAscii(img, width) {
        const aspectRatio = img.height / img.width;
        const height = Math.floor(width * aspectRatio * SYMBOL_RATIO);

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const imageData = ctx.getImageData(0, 0, width, height);
        const pixels = imageData.data;
        let asciiStr = '';
        const charCount = activeCharset.length;

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const idx = (y * width + x) * 4;
            const gray = 0.2126 * pixels[idx] + 0.7152 * pixels[idx+1] + 0.0722 * pixels[idx+2];
            const charIndex = Math.floor(gray / 255 * (charCount - 1));
            asciiStr += activeCharset[charIndex];
          }
          asciiStr += '\n';
        }
        return asciiStr;
      }

      async function updateAscii() {
        if (!currentImage) {
          outputPre.textContent = '// выберите изображение';
          downloadBtn.disabled = copyBtn.disabled = true;
          return;
        }
        const width = parseInt(widthSlider.value, 10);
        if (!activeCharset.length) {
          outputPre.textContent = '// набор символов пуст';
          return;
        }
        setTimeout(() => {
          try {
            currentAscii = imageToAscii(currentImage, width);
            outputPre.textContent = currentAscii;
            downloadBtn.disabled = copyBtn.disabled = false;
          } catch (e) {
            outputPre.textContent = '// ошибка: ' + e.message;
            downloadBtn.disabled = copyBtn.disabled = true;
          }
        }, 10);
      }

      imageInput.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => { currentImage = img; updateAscii(); };
          img.onerror = () => {
            outputPre.textContent = '// не удалось загрузить изображение';
            currentImage = null;
            downloadBtn.disabled = copyBtn.disabled = true;
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      widthSlider.addEventListener('input', () => {
        widthValue.textContent = widthSlider.value;
        updateAscii();
      });

      downloadBtn.addEventListener('click', () => {
        if (!currentAscii) return;
        const blob = new Blob([currentAscii], {type:'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'ascii_art.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      copyBtn.addEventListener('click', async () => {
        if (!currentAscii) return;
        try {
          await navigator.clipboard.writeText(currentAscii);
          copyBtn.textContent = '✓ Скопировано';
          copyBtn.style.background = '#00cc00';
          setTimeout(() => {
            copyBtn.textContent = '📋 Копировать';
            copyBtn.style.background = '#33ff33';
          }, 1500);
        } catch (err) { alert('Ошибка копирования: ' + err); }
      });

      // старт
      window.addEventListener('load', async () => {
        await loadJsonCharset();
        // если json не загрузился – скрываем или делаем пункт неактивным (опционально)
        if (jsonCharset.length === 0) {
          // можно убрать пункт "json" или просто оставить, он будет использовать классический
        }
        updateActiveCharset(); // классический по умолчанию
      });
    })();
  </script>
</body>
</html>
